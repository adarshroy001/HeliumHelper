# Every check from the Definition of Done (docs/CONVENTIONS.md). The job name `check` is the required status check.
name: CI

on:
  # Every branch push gets one run. Its result shows on that branch's pull request too.
  push:
  # Pull requests from forks don't trigger a push in this repo, so they run here instead (see the job's `if`).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep every run on main; on other branches a newer push cancels the older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    # Same-repo pull requests were already checked by their push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the pushed range

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages
        # Git hooks can be skipped locally; this cannot. Skipped for a new branch's first push and for fork PRs.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:int

      - name: HTTP tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
