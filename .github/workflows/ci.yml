# Every check from the Definition of Done (docs/CONVENTIONS.md). The job name `check` is the required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep every run on main; on a pull request a newer push cancels the older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the full commit range

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages
        # Git hooks can be skipped locally; this cannot. Checks the pull request's commits, or the commits pushed to main.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --from "$BEFORE" --to HEAD --verbose
          else
            echo "First push of the branch: nothing to compare against."
          fi

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Infrastructure templates (cdk synth)
        run: pnpm cdk synth --quiet

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:int

      - name: HTTP tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Smoke tests (built app)
        run: pnpm test:smoke

      - name: Docker image
        run: |
          docker build -t helium-backend:ci .
          size=$(docker image inspect helium-backend:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB (budget 500 MB)"
          test "$size" -lt $((500 * 1024 * 1024)) || { echo "The image is over its 500 MB budget."; exit 1; }
          # The image starts and loads every dependency: without configuration it must exit 1 with one JSON line.
          set +e; out=$(docker run --rm helium-backend:ci); code=$?; set -e
          echo "$out"
          test "$code" -eq 1 && echo "$out" | grep -q '"msg":"startup failed"'
