# Local dependencies for `pnpm dev`: MongoDB, Valkey (Redis) and ElasticMQ (SQS). Start with `docker compose up -d`; the URIs in .env.example point here.
# Tests don't use this file: they start their own containers (test/global-setup.ts).
name: helium-backend

services:
  mongo:
    image: mongo:7.0
    # A single-node replica set: transactions need one.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  valkey:
    image: valkey/valkey:8.1
    # As in ElastiCache: nothing is evicted silently when memory runs out (ADR-0007).
    command: ['valkey-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    ports:
      - '9324:9324'
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  mongo-data:
