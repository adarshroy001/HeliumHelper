# ElasticMQ (local SQS) for docker-compose. Each task that adds a queue adds it here too, with its DLQ,
# named as in AWS but with the `helium-local-` prefix (SQS_QUEUE_URL_PREFIX in .env.example). Example:
#
#   helium-local-wa-send {
#     defaultVisibilityTimeout = 30 seconds
#     deadLettersQueue { name = "helium-local-wa-send-dlq", maxReceiveCount = 5 }
#   }
#   helium-local-wa-send-dlq { }
include classpath("application.conf")

node-address {
  host = "localhost"
  port = 9324
}

queues {
  helium-local-system-jobs {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "helium-local-system-jobs-dlq", maxReceiveCount = 5 }
  }
  helium-local-system-jobs-dlq { }
  helium-local-wa-status {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "helium-local-wa-status-dlq", maxReceiveCount = 10 }
  }
  helium-local-wa-status-dlq { }
  helium-local-wa-inbound {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "helium-local-wa-inbound-dlq", maxReceiveCount = 5 }
  }
  helium-local-wa-inbound-dlq { }
  helium-local-wa-account {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "helium-local-wa-account-dlq", maxReceiveCount = 5 }
  }
  helium-local-wa-account-dlq { }
  helium-local-wa-send-p1 {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "helium-local-wa-send-p1-dlq", maxReceiveCount = 15 }
  }
  helium-local-wa-send-p1-dlq { }
  helium-local-wa-send-p2 {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "helium-local-wa-send-p2-dlq", maxReceiveCount = 15 }
  }
  helium-local-wa-send-p2-dlq { }
  helium-local-messaging-jobs {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue { name = "helium-local-messaging-jobs-dlq", maxReceiveCount = 5 }
  }
  helium-local-messaging-jobs-dlq { }
}
