# pnpm settings for this single-package repo (pnpm 12 reads them from here).

# Fail the install on a Node version outside package.json "engines".
engineStrict: true

# Save exact versions; the lockfile and Dependabot handle updates (ADR-0014).
savePrefix: ''

# Dependency install scripts run only when listed true here. Deny anything we don't need (ADR-0014).
allowBuilds:
  # swagger-ui telemetry (via @nestjs/swagger). Not needed.
  '@scarf/scarf': false
  # testcontainers' optional SSH support (native build). Not needed: Docker runs locally or in CI.
  cpu-features: false
  ssh2: false
  # Optional postinstall of a transitive gRPC dependency. Not needed.
  protobufjs: false
